name: check

run-name: check ${{ github.ref_name }}

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
      # The typos release the gate was verified against locally. The pin has to
      # match the version that passed here, or the gate is a different gate.
      TYPOS_VERSION: v1.50.3
      # The toolchain the source is written against. `moon fmt --check` is
      # sensitive to the formatter of the version, so the gate has to run the
      # pinned one: installing "latest" would make the release depend on
      # whatever the toolchain does that week.
      MOON_VERSION: 0.1.20261102

    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          # The MoonBit CDN only serves the "latest" binaries: every
          # versioned path answers 403, so the toolchain cannot be pinned
          # from here. The version check below is therefore a policy about
          # what the runner found, not a download.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit version
        run: |
          moon version --all
          moonrun --version
          installed="$(moon version --all | head -1 | awk '{print $2}')"
          echo "MoonBit $installed (the gate was verified against $MOON_VERSION)"
          oldest="$(printf '%s\n%s\n' "$MOON_VERSION" "$installed" | sort -V | head -1)"
          if [ "$oldest" != "$MOON_VERSION" ]; then
            echo "::error::MoonBit $installed is OLDER than the verified $MOON_VERSION; the source may need a newer toolchain."
            exit 1
          fi
          if [ "$installed" != "$MOON_VERSION" ]; then
            echo "::warning::MoonBit $installed is NEWER than the verified $MOON_VERSION. Every gate below has to pass as it is; if the formatter changed, `moon fmt --check` is where that shows up."
          fi

      # Refresh the registry metadata before anything else, so the dependency
      # check below reads a current index.
      - name: Update dependencies
        run: moon update

      - name: Check the runtime comes from the toolchain
        run: |
          # There is NO pinned runtime any more. The async runtime is
          # `moonbitlang/core/async`, part of the `moonbitlang/core` module the
          # toolchain already bundles, so there is nothing here that can drift
          # from the registry -- and nothing that can disagree with the host
          # that instantiates the published artifact.
          #
          # What this check enforces is the swap ITSELF: a `moonbitlang/async`
          # dependency coming back would put the pin, and the host-floor
          # disagreement, back.
          if grep -q 'moonbitlang/async@' moon.mod; then
            echo "::error::moon.mod pins moonbitlang/async again. The runtime must come from the toolchain's bundled moonbitlang/core."
            exit 1
          fi
          hits="$(git ls-files | grep 'moon\.pkg$' | xargs -r grep -l '"moonbitlang/async' || true)"
          if [ -n "$hits" ]; then
            echo "::error::a tracked moon.pkg imports moonbitlang/async again: $hits"
            exit 1
          fi
          if ! grep -q 'moonbitlang/core/async' moon.pkg; then
            echo "::error::the root package does not import moonbitlang/core/async."
            exit 1
          fi
          echo "runtime: moonbitlang/core/async (from the toolchain; no pin to drift)"

      # The runtime comes from the toolchain, so the version of
      # `moonbitlang/core` this module builds against is the USER's toolchain,
      # not a pin here. The core's API can change shape between toolchains,
      # and this module has to build against all of them.
      #
      # MEASURED: this very release failed on the runner because
      # `read_from_process()` changed its return type between core 0.10.19 and
      # 0.10.20, and the capture call compiled against one and not the other.
      # The gate fetches the registry's newest core and compares every
      # declaration this module uses against it, and against every core on the
      # machine.
      - name: Check the core compatibility
        run: node scripts/qa/core_compat.mjs

      # NATIVE AND WASM. The module declares `supported_targets = "+native+wasm"`:
      # the analyzer needs the filesystem and process spawning, and the async
      # runtime implements both on those two backends only. wasm-gc has no
      # `fs`/`process` implementation upstream at all, and js has no async
      # runtime, so neither is supported.
      #
      # No --deny-warn either: the warnings are outstanding (the deprecated
      # `Map::new()` calls, the `test_unqualified_package` notices in the
      # tests, and a handful of unused values). They are catalogued as a
      # finding in docs/qa/REPORT.md, not hidden behind a flag.
      - name: Check package (native)
        run: moon check --target native

      - name: Test package (native)
        run: moon test src/app --target native

      - name: Check package (wasm)
        run: moon check --target wasm

      - name: Test package (wasm)
        run: moon test src/app --target wasm

      - name: Check formatting
        run: moon fmt --check

      - name: Build the CLI
        run: moon build src/cli --target native

      # The ROOT package is what `moonx <module>@latest` resolves, and the
      # registry publishes its artifact. A root package that is not an
      # executable, or that does not build for wasm, fails ONLY after a
      # release -- so it is checked before one.
      - name: Build the root package (wasm)
        run: moon build . --target wasm

      - name: Check the root package
        run: node scripts/qa/root_package.mjs

      # The published wasm is not self-contained: it imports host symbols, and
      # the HOST has to provide every one of them when the module is
      # instantiated. The floor is a property of the TOOLCHAIN now, so it is
      # measured against the runner's own bundled core -- and a symbol the
      # bundled core does not declare is a host that fails with "function
      # import requires a callable" at instantiation.
      - name: Check the host requirements
        run: node scripts/qa/host_requirements.mjs

      # The resolver must find the executable under either name the
      # toolchain could produce. This is the check that keeps a platform
      # difference from turning into a confusing failure three steps later.
      - name: Check the CLI resolver
        run: node scripts/qa/cli_resolver.mjs

      - name: Download typos
        run: curl -LsSf https://github.com/crate-ci/typos/releases/download/$TYPOS_VERSION/typos-$TYPOS_VERSION-x86_64-unknown-linux-musl.tar.gz | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Check typos
        run: typos

      # The committed artefacts, validated against the pinned file names.
      - name: Verify the committed reports
        run: node scripts/verify.mjs

      # The QA harness. These are the same scripts and the same thresholds the
      # README publishes, so a green run here is the claim in the README.
      - name: Acceptance scenarios (Gherkin)
        run: node scripts/qa/gherkin.mjs

      - name: End-to-end runs and determinism
        run: node scripts/qa/e2e.mjs

      - name: Robustness corpus
        run: node scripts/qa/fuzz.mjs

      - name: Output confinement
        run: node scripts/qa/path_traversal.mjs

      - name: Nesting degradation
        run: node scripts/qa/deep_nesting_probe.mjs

      - name: Vendored-tree isolation
        run: node scripts/qa/vendor_isolation.mjs
