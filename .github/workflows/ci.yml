name: check

run-name: check ${{ github.ref_name }}

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
      # The typos release the gate was verified against locally. The pin has to
      # match the version that passed here, or the gate is a different gate.
      TYPOS_VERSION: v1.50.3
      # The toolchain the source is written against. `moon fmt --check` is
      # sensitive to the formatter of the version, so the gate has to run the
      # pinned one: installing "latest" would make the release depend on
      # whatever the toolchain does that week.
      MOON_VERSION: 0.1.20261102

    steps:
      - uses: actions/checkout@v4
        with:
          # The TAGS are needed, not only the tip: the release-note checker
          # compares the `.mbti` of every released version -- `git show
          # <tag>:src/app/pkg.generated.mbti` -- against that version's
          # notes. A shallow checkout has no tags to compare.
          fetch-depth: 0

      - name: Install MoonBit
        run: |
          # The MoonBit CDN only serves the "latest" binaries: every
          # versioned path answers 403, so the toolchain cannot be pinned
          # from here. The version check below is therefore a policy about
          # what the runner found, not a download.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit version
        run: |
          moon version --all
          moonrun --version
          installed="$(moon version --all | head -1 | awk '{print $2}')"
          echo "MoonBit $installed (the gate was verified against $MOON_VERSION)"
          oldest="$(printf '%s\n%s\n' "$MOON_VERSION" "$installed" | sort -V | head -1)"
          if [ "$oldest" != "$MOON_VERSION" ]; then
            echo "::error::MoonBit $installed is OLDER than the verified $MOON_VERSION; the source may need a newer toolchain."
            exit 1
          fi
          if [ "$installed" != "$MOON_VERSION" ]; then
            echo "::warning::MoonBit $installed is NEWER than the verified $MOON_VERSION. Every gate below has to pass as it is; if the formatter changed, `moon fmt --check` is where that shows up."
          fi

      # Refresh the registry metadata before anything else, so the dependency
      # check below reads a current index.
      - name: Update dependencies
        run: moon update

      - name: Check the runtime comes from the toolchain
        run: |
          # There is NO pinned runtime any more. The async runtime is
          # `moonbitlang/core/async`, part of the `moonbitlang/core` module the
          # toolchain already bundles, so there is nothing here that can drift
          # from the registry -- and nothing that can disagree with the host
          # that instantiates the published artifact.
          #
          # What this check enforces is the swap ITSELF: a `moonbitlang/async`
          # dependency coming back would put the pin, and the host-floor
          # disagreement, back.
          if grep -q 'moonbitlang/async@' moon.mod; then
            echo "::error::moon.mod pins moonbitlang/async again. The runtime must come from the toolchain's bundled moonbitlang/core."
            exit 1
          fi
          hits="$(git ls-files | grep 'moon\.pkg$' | xargs -r grep -l '"moonbitlang/async' || true)"
          if [ -n "$hits" ]; then
            echo "::error::a tracked moon.pkg imports moonbitlang/async again: $hits"
            exit 1
          fi
          if ! grep -q 'moonbitlang/core/async' moon.pkg; then
            echo "::error::the root package does not import moonbitlang/core/async."
            exit 1
          fi
          echo "runtime: moonbitlang/core/async (from the toolchain; no pin to drift)"

      # The runtime comes from the toolchain, so the version of
      # `moonbitlang/core` this module builds against is the USER's toolchain,
      # not a pin here. The core's API can change shape between toolchains,
      # and this module has to build against all of them.
      #
      # MEASURED: this very release failed on the runner because
      # `read_from_process()` changed its return type between core 0.10.19 and
      # 0.10.20, and the capture call compiled against one and not the other.
      # The gate fetches the registry's newest core and compares every
      # declaration this module uses against it, and against every core on the
      # machine.
      - name: Check the core compatibility
        run: node scripts/qa/core_compat.mjs

      # NATIVE, WASM AND JS. The module declares `supported_targets =
      # "+native+wasm+js"`. The analyzer needs the filesystem (it reads the
      # sources it analyses) and process spawning (it runs `moon fetch`), and
      # the async runtime implements both ONLY on native and wasm -- on js the
      # `fs` and `process` packages compile to nothing. So the fs/process call
      # sites sit behind `#cfg` guards with stubs for the other backends, and
      # the js build is a REAL build: the library is checked and its tests run
      # there, not skipped.
      #
      # wasm-gc is NOT supported, and it is not a choice: the core's wasm-gc
      # async stub has no `run_async_main`, so `async fn main` cannot compile
      # there at all. Naming the supported set makes check/test SKIP that
      # backend instead of failing with a wall of errors.
      #
      # No --deny-warn either: the warnings are outstanding (the deprecated
      # `Map::new()` calls, the `test_unqualified_package` notices in the
      # tests, and a handful of unused values). They are catalogued as a
      # finding in docs/qa/REPORT.md, not hidden behind a flag.
      - name: Check package (native)
        run: moon check --target native

      - name: Test package (native)
        run: moon test src/app --target native

      - name: Check package (wasm)
        run: moon check --target wasm

      - name: Test package (wasm)
        run: moon test src/app --target wasm

      - name: Check package (js)
        run: moon check --target js

      - name: Test package (js)
        run: moon test src/app --target js

      # THE COVERAGE ROUTE. `simp_caret` is the DEFAULT report format and the
      # only one that PARSES the covered sources, so a source file the
      # reporter's lexer cannot read breaks `moon coverage analyze` outright.
      # The reporter's lexer RESERVES identifiers the MoonBit compiler accepts
      # (`method`, `abstract`, ...), so this is a property of the tree, not of
      # the tooling. The static gate knows the reserved words; the report step
      # proves the route works and would catch a word the peer adds later.
      - name: Check the coverage route
        run: |
          node scripts/qa/coverage_route.mjs
          moon test --enable-coverage
          mkdir -p _build/qa
          moon coverage report -f simp_caret > _build/qa/simp_caret.txt
          tail -n 1 _build/qa/simp_caret.txt

      # ... and this one proves the check above can go RED.  It runs the real
      # check on COPIES of the tree under `_build/` -- never a tracked file --
      # and plants a reserved identifier in three places: after a multi-line
      # literal, in a file with no literal, and before any literal.  It exists
      # because the check's own string-stripper used to look for a `|#` closer
      # that MoonBit's multi-line string never has, which blanked the rest of
      # the file: the check read 20,964 of the tree's code lines where it
      # reads 24,321 now, and a reserved identifier planted after a literal
      # left it GREEN.
      - name: Check that the coverage-route check can fail
        run: node scripts/qa/coverage_route_falsify.mjs

      # THE IFDS SPIKE. A MEASUREMENT, not a feature: the spike lives in
      # `src/app/ifds_spike_wbtest.mbt` and is not reachable from the CLI. The
      # harness drives it over the fixture corpus and checks the four
      # measurements of `docs/qa/IFDS_SPIKE.md` -- no lost sink, the blanket
      # rule's contribution accounted for, the model's gaps counted, the scale
      # reported. The run ALSO proves the corpus loader works: it is the only
      # thing in the tree that reads a module tree from inside a test, and it
      # does it through the toolchain's async runtime.
      #
      # The `--falsify` run breaks each check on purpose and asserts that the
      # check then fails. A check that cannot fail is not a check.
      - name: Check the IFDS spike
        run: |
          node scripts/qa/ifds_spike.mjs --corpus fixtures --label fixtures
          node scripts/qa/ifds_spike.mjs --corpus fixtures --label fixtures-falsify --falsify

      - name: Check formatting
        run: moon fmt --check

      - name: Build the CLI
        run: moon build src/cli --target native

      # The ROOT package is what `moonx <module>@latest` resolves, and the
      # registry publishes its artifact. A root package that is not an
      # executable, or that does not build for wasm, fails ONLY after a
      # release -- so it is checked before one.
      - name: Build the root package (wasm)
        run: moon build . --target wasm

      - name: Check the root package
        run: node scripts/qa/root_package.mjs

      # THE DIMENSION MATRIX, CHECKED AGAINST WHAT IT CROSSES.  Section 5.11
      # of the report crosses the finding FAMILIES with the METHOD that
      # found each one, and it reads the same sink the findings tables fill.
      # That is a claim, so it is measured: every row adds up to its own
      # total, every column to its own, and every CELL is the count of the
      # findings of that family that that method found.
      #
      # It runs over the COMMITTED ARTEFACTS -- the published reports, where a
      # wrong matrix is wrong in public -- and over a LIVE run of the
      # analyser, which is what proves the wiring on the tree as it stands
      # now.  The comparison is between two halves of the SAME report, so it
      # does not depend on the toolchain: a newer toolchain that finds more
      # findings moves both sides together.
      - name: Check the dimension matrix against the findings it crosses
        run: node scripts/qa/dimension_matrix.mjs

      # The published wasm is not self-contained: it imports host symbols, and
      # the HOST has to provide every one of them when the module is
      # instantiated. The floor is a property of the TOOLCHAIN now, so it is
      # measured against the runner's own bundled core -- and a symbol the
      # bundled core does not declare is a host that fails with "function
      # import requires a callable" at instantiation.
      - name: Check the host requirements
        run: node scripts/qa/host_requirements.mjs

      # The resolver must find the executable under either name the
      # toolchain could produce. This is the check that keeps a platform
      # difference from turning into a confusing failure three steps later.
      - name: Check the CLI resolver
        run: node scripts/qa/cli_resolver.mjs

      - name: Download typos
        run: curl -LsSf https://github.com/crate-ci/typos/releases/download/$TYPOS_VERSION/typos-$TYPOS_VERSION-x86_64-unknown-linux-musl.tar.gz | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Check typos
        run: typos

      # The committed artefacts, validated against the pinned file names.
      - name: Verify the committed reports
        run: node scripts/verify.mjs

      # The README publishes two measured tables -- the performance table and
      # the gate table -- and every cell in them is a MEASUREMENT. The three
      # committed-artefact rows are checked against the summaries they came
      # from, the two places that repeat the self-scan numbers are checked
      # against the README's own row, and the gate table's TEST COUNT is
      # checked against a live run of the tests. The test count is this
      # repository's own, so it does not depend on the toolchain.
      #
      # The LIVE self-scan is NOT run here: this runner installs the NEWEST
      # toolchain, and a count the newest parser reads differently from the
      # one that measured the numbers would fail for a reason that has
      # nothing to do with this tree. The live measurement is the LOCAL
      # release-prep check (`scripts/qa/readme_table.mjs` without the flag),
      # where the toolchain is the one that produced the numbers.
      - name: Check the README's live table against the tree
        run: node scripts/qa/readme_table.mjs --no-selfscan

      # The same check, with its artefact-total expectations INVERTED on
      # purpose: every one of them has to fail. A claim that still passes is
      # vacuous -- it is not really compared with the artefact -- so this
      # proves the drift detector can actually fail. Those totals drifted
      # once already: Phase 2 regenerated the artefact and the prose kept
      # the previous ones.
      - name: Check that the README's drift detector can fail
        run: node scripts/qa/readme_table.mjs --no-selfscan --falsify

      # THE DRIFT DETECTOR MUST COMPARE COUNTS EXACTLY.  The README's
      # published numbers are kept true by `readme_table.mjs`, which compares
      # every published count with the count that was MEASURED.  The only way
      # such a comparison may pass is for the two to BE the same -- an
      # ORDERING comparison ("at most the measured count") is satisfied by a
      # README that under-states the tree, so it passes VACUOUSLY.
      #
      # The check reads the detector's source with comments and string
      # literals stripped, so a comparison that is only *mentioned* in prose
      # is not a comparison, and it allows the one ordering comparison the
      # detector legitimately has: the sentinel "was the index found?".
      - name: Check that the drift detector compares counts exactly
        run: node scripts/qa/exact_counts.mjs

      # ... and this one proves the check above can go RED, and that it does
      # not fire on a comparison that is only mentioned.  It breaks the
      # detector ON A COPY under `_build/`, so the tracked source is never
      # written.
      - name: Check that the exact-counts check can fail
        run: node scripts/qa/exact_counts_falsify.mjs

      # THE PUBLISHED INTERFACE, CHECKED AGAINST THE RELEASE NOTES. A release
      # that changes the published `.mbti` can break a consumer's build, and
      # the release notes are the only place a consumer reads that. This
      # compares the `.mbti` of every released version against that version's
      # notes, and fails when the version being prepared breaks the published
      # interface without saying so -- it found a missing declaration the
      # first time it ran.
      #
      # It needs the TAGS, which is why the checkout above fetches the whole
      # history.
      - name: Check the published interface against the release notes
        run: node scripts/qa/release_interface.mjs

      # The LOOP's three items, each checked by RUNNING it rather than by
      # reading a document that says so: the bounded findings table, D1 (the
      # five dead rules) + D2 (the de-duplication key that dropped the file),
      # and the Phase-1 spike. Each item was also broken on purpose and had
      # to fail -- docs/qa/LOOP_ACCEPTANCE.md has the three cases.
      - name: The LOOP's three items, checked by running them
        run: node scripts/qa/loop_acceptance.mjs

      # IFDS PHASE 2 -- the SIZE of a container, and the taint of its CONTENTS.
      # The check runs the ANALYSER over nine shapes and compares what it says
      # with what the phase claims: a container whose CONTENTS are tainted and
      # whose count is not the untrusted input's to choose must produce NO
      # allocation-size claim, and a size that really IS the untrusted input's
      # to choose must still produce one -- and must name only the sources
      # that decide the SIZE.
      #
      # It also checks the COVERAGE LEDGER: the twenty doubleML claims the
      # repair removed are named in docs/qa/IFDS_PHASE2_LEDGER.json, and none
      # of them may be back in the committed artefact.
      #
      # The `--falsify` run inverts one expectation on purpose and requires
      # the check to fail. A check that cannot fail is not a check.
      - name: Check the size-taint separation
        run: |
          node scripts/qa/size_taint.mjs
          node scripts/qa/size_taint.mjs --no-build --falsify

      # IFDS PHASE 3 -- the size of a `+`-built array. The analyser over six
      # shapes: the count of a concatenation is the SUM of the two counts, and
      # the claim about the size names only the sources that decide the COUNT
      # and never the elements'.
      #
      # It also checks the COVERAGE LEDGER in BOTH directions: the fourteen
      # doubleML claims the repair removed are named in
      # docs/qa/IFDS_PHASE3_LEDGER.json and none of them may be back in the
      # committed artefact, and the twenty-nine it added are named too, so the
      # half of the trade that ADDS claims is registered as carefully as the
      # half that removes them.
      #
      # The `--falsify` run inverts one expectation on purpose and requires
      # the check to fail. A check that cannot fail is not a check.
      - name: Check the size of a `+`-built array
        run: |
          node scripts/qa/plus_size.mjs
          node scripts/qa/plus_size.mjs --no-build --falsify

      # The QA harness. These are the same scripts and the same thresholds the
      # README publishes, so a green run here is the claim in the README.
      - name: Acceptance scenarios (Gherkin)
        run: node scripts/qa/gherkin.mjs

      - name: End-to-end runs and determinism
        run: node scripts/qa/e2e.mjs

      # THE COUNTEREXAMPLES, checked against the report that states them.
      # Every comparison is between two numbers of the SAME run -- the report
      # against its own sidecars -- so a toolchain that finds a different set
      # of findings moves both sides together.  The live self-scan is part of
      # it because the fixture has no finding that no input reproduces, and a
      # check that never sees one is a check that never fires.
      - name: Check the counterexamples against the report
        run: node scripts/qa/counterexamples.mjs

      # The proof that the check above can fail: it mutates COPIES of the
      # artefacts -- never a tracked file -- and asserts the check goes red on
      # each mutation, plus a control it must NOT notice.
      - name: Check that the counterexample check can fail
        run: node scripts/qa/counterexamples_falsify.mjs

      # THE REGISTER OF THE ANALYSER'S CLAIMS ABOUT ITS OWN SOURCE,
      # CHECKED AGAINST THE ANALYSER.  `src/app/selfscan_guards_wbtest.mbt`
      # holds the register: every claim the analyser makes about its OWN
      # source, and the guard that answers it.  It had drifted -- it was
      # measured against 26 claims and the tree made 29, and three of them
      # nobody had answered -- so it is RE-MEASURED on every run now.
      #
      # The comparison does not depend on the toolchain: the claims come
      # from this module's OWN parser (`src/app/parser.mbt`) reading this
      # module's OWN source, so a newer MoonBit does not move them.  A
      # difference means the TREE changed -- which is exactly when the
      # register has to be written again.
      - name: Check the register of the analyser's claims about its own source
        run: node scripts/qa/selfscan_register.mjs

      # ... and this one proves the check above can go RED: it breaks the
      # register ON A COPY under `_build/` -- never a tracked file -- and
      # asserts the check notices, and that it notices the right thing.
      - name: Check that the register check can fail
        run: node scripts/qa/selfscan_register_falsify.mjs

      # THE DEFAULT SCAN'S COVERAGE RULE, MEASURED: the default scan enters
      # every function, and the bound that stops it is a WORK budget rather
      # than a count of functions.  The check runs the scan three ways -- the
      # default, with the budget made small, and with the count cap made
      # small -- and reads which bound stopped each one.
      - name: Check the default scan's coverage rule
        run: node scripts/qa/l1_coverage.mjs

      # ... and this one proves the check above can go RED: it breaks COPIES
      # of the artefacts under `_build/` -- never a tracked file -- and
      # asserts the check notices, and that it notices the right thing.
      - name: Check that the coverage check can fail
        run: node scripts/qa/l1_coverage_falsify.mjs

      # THE PACKAGE THE REGISTRY CAN READ.  `moon publish` uploads an archive,
      # and the registry refuses an archive it cannot parse: the 0.1.35 upload
      # came back with "400 Bad Request, detail: Invalid ZIP archive" because
      # the package carried 162,703,756 bytes of unpacked content and an
      # 80,863,997-byte entry, where the largest archive the registry had
      # served (0.1.34) carried 46,274,868 bytes and a 39,479,846-byte entry.
      # The message names no limit, so the limit is kept here instead: this
      # check measures the package this tree would publish and fails BEFORE a
      # release, not at the registry after one.
      #
      # The file set is git's own answer to "which files are not ignored", and
      # the packer was MEASURED to agree with it.  The raw traces stay in the
      # repository and stay out of the archive, and the check says so in both
      # directions.
      - name: Check the package the registry can read
        run: node scripts/qa/package_envelope.mjs

      # ... and this one proves the check above can go RED: it feeds the check
      # a mutated MODEL -- the file set, written out under `_build/`, never a
      # tracked file -- and asserts the check notices, and that it notices the
      # right thing.
      - name: Check that the package envelope check can fail
        run: node scripts/qa/package_envelope_falsify.mjs

      # THE PER-PACKAGE MODE, MEASURED.  The step budget is a bound on the
      # work, and the work of a module is the work of its PACKAGES, so a
      # module-wide budget is spent on the first packages in file order.  The
      # per-package mode gives each package its own budget, and the check
      # runs the scan both ways and reads which one reached further -- with
      # the same one-step budget, the module-wide scan enters ONE function and
      # the per-package scan enters one in EVERY package.
      #
      # The check also holds the SPLIT honest: the per-package traces must
      # hold every event of the module, once, and each event must belong to
      # the package whose file it names.
      - name: Check the per-package mode
        run: node scripts/qa/per_package.mjs

      # ... and this one proves the check above can go RED: it breaks COPIES
      # of the artefacts under `_build/` -- never a tracked file -- and
      # asserts the check notices, and that it notices the right thing.
      - name: Check that the per-package check can fail
        run: node scripts/qa/per_package_falsify.mjs

      - name: Robustness corpus
        run: node scripts/qa/fuzz.mjs

      - name: Output confinement
        run: node scripts/qa/path_traversal.mjs

      - name: Nesting degradation
        run: node scripts/qa/deep_nesting_probe.mjs

      - name: Vendored-tree isolation
        run: node scripts/qa/vendor_isolation.mjs

      # THE GATE'S VERDICTS: a FAIL is not an UNKNOWN.
      #
      # The harnesses under scripts/qa/ use exit 2 for "this check could not
      # produce a verdict" -- the registry was unreachable, the analyser wrote
      # no findings, there was nothing to compare -- and exit 1 for "the
      # checks failed". The gate now READS that, so "I could not verify" is
      # reported as such instead of as a defect in the tree.
      #
      # This check proves the four things that have to hold together: the
      # classifier puts 0, 1 and 2 in their own buckets; three shipped checks
      # really do exit 2 when they cannot decide; the gate's own step list
      # contains steps that CAN report UNKNOWN, so the bucket is not dead
      # code; and the runner resolves its own default step list on THIS
      # platform -- a Windows path separator does not work on Linux.
      #
      # It drives the gate runner with its OWN step list, so it never runs the
      # real gate. It needs a PowerShell -- `powershell` on Windows, `pwsh`
      # on the Linux runner -- and it exits 2 if there is none, because a
      # check that cannot run has no verdict.
      - name: Check the gate's verdicts
        run: node scripts/qa/gate_verdicts.mjs

      # THE VERDICT, INSIDE THE ANALYSER.  The gate above reads an exit code;
      # this reads the analyser's own third state.  A claim the analyser could
      # NOT decide must not look like a claim it decided and found clean, so a
      # finding carries a verdict, the report has a Verdict column and a
      # section for the claims that could not be decided, and the POLICY
      # decides what an undecided claim means.
      #
      # It runs the analyser over a module whose loop is past the
      # interpreter's budget, so the undecided state is reached for real.
      - name: Check that an undecided claim is reported as undecided
        run: node scripts/qa/finding_verdicts.mjs

      # THE METAMORPHIC GATE.  The findings must not depend on how the source
      # is written down: the same program with other identifiers, with its
      # functions in another order, or with `a + b` written as `b + a`, must
      # make the same claims.  A check that runs the analyser once measures
      # ONE shape of the input; this one measures the analyser.
      - name: Check that the findings do not depend on the source's spelling
        run: node scripts/qa/metamorphic.mjs

      # A SIGNATURE MUST NOT DEPEND ON THE TARGET.  MEASURED: the peer
      # analyzer reported 2 ArgTypeMismatch findings on `src/app/scan.mbt`
      # because the file held two definitions of `walk_dir` -- one with six
      # parameters and one with five -- and an analyzer that does not evaluate
      # `#cfg` reads the two calls as too many arguments.  The MoonBit
      # compiler agreed the second definition was dead.  This check holds the
      # invariant on its own, without the peer and without a build.
      - name: Check that a signature does not depend on the target
        run: node scripts/qa/cfg_signatures.mjs

      # ... and this one proves the check above can go RED: it breaks the
      # invariant on a COPY of the tree and asserts that the check notices,
      # and that it notices the right thing.
      - name: Check that the signature check can fail
        run: node scripts/qa/cfg_signatures_falsify.mjs

      # THE PEER'S VERDICT ON THIS SOURCE.  The cross-check, made
      # RE-RUNNABLE: the peer analyzer reads this module, and it must report
      # no actionable finding in the source that ships.  The fixture corpus
      # is deliberately vulnerable -- it is what the analyser is tested
      # against -- so it is excluded, and the exclusion is printed.
      #
      # This step needs the registry.  If it cannot reach it, the check
      # exits 2 -- "could not decide" -- rather than passing quietly.
      - name: Check the peer's verdict on this source
        run: node scripts/qa/peer_scan.mjs

      # ... and this one proves the check above can go RED.  The peer's
      # verdict has a COVERAGE, not just a count: the peer does not parse
      # every file it reads, and for the files it stops at a parse error it
      # has NO verdict.  The check pins that boundary against
      # `docs/qa/PEER_PARSE_GAPS.json` -- so the coverage cannot shrink
      # silently -- and this falsifier breaks COPIES of the ledger and of
      # the peer's own captured report, and asserts the check goes red and
      # names the right reason.
      - name: Check that the peer-scan check can fail
        run: node scripts/qa/peer_scan_falsify.mjs

      # THE VERSION `@latest` RESOLVES TO.  The analyser pins the version the
      # fetch wrote, and a toolchain module's version is a DATE with a build
      # hash on the end -- "0.1.20261126+3c0520448".  MEASURED BUG (2026-11-28):
      # the comparison read the whole segment as a number, so the hash made it
      # unparseable, EVERY toolchain version compared EQUAL to every other one,
      # and the OLDEST won.  The report then described a tree 24 days older
      # than the registry's latest.
      #
      # The check plants a DECOY -- a version directory one day older, in a
      # scratch probe of its own -- so the candidate list holds a wrong answer
      # and the check has something to reject.  It needs the registry; without
      # it, it exits 2 -- "could not decide" -- rather than passing quietly.
      - name: Check the version `@latest` resolves to
        run: node scripts/qa/version_pin.mjs

      # ... and this one proves the check above can go RED, and that it says
      # UNKNOWN -- not PASS, and not FAIL -- when it cannot decide.
      - name: Check that the version-pin check can fail
        run: node scripts/qa/version_pin_falsify.mjs

      # THE GATE LISTS MUST NOT DRIFT.  The peer scan above was CI step 56
      # and was never a local gate step, so five commits reported "gate
      # green" while CI was red on it.  This check asserts the one-way
      # invariant that failure taught: every check CI runs must also be run
      # by the local gate.  The other direction is harmless and only noted.
      - name: Check that the gate lists have not drifted
        run: node scripts/qa/gate_parity.mjs
